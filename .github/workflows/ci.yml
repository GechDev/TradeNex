name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            build_type: Release
            sanitize: OFF
          - os: ubuntu-22.04
            compiler: clang-16
            build_type: Release
            sanitize: ON
          - os: windows-latest
            compiler: msvc
            build_type: Release
            sanitize: OFF

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc-12" ]; then
            sudo apt-get install -y g++-12 ninja-build
            echo "CC=gcc-12" >> $GITHUB_ENV
            echo "CXX=g++-12" >> $GITHUB_ENV
          elif [ "${{ matrix.compiler }}" = "clang-16" ]; then
            sudo apt-get install -y clang-16 ninja-build
            echo "CC=clang-16" >> $GITHUB_ENV
            echo "CXX=clang++-16" >> $GITHUB_ENV
          fi

      - name: Set up Windows Ninja
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTRADENEX_SANITIZE=${{ matrix.sanitize }}
          -DTRADENEX_BUILD_TESTS=ON
          -DTRADENEX_BUILD_BENCHMARKS=ON
          -DTRADENEX_BUILD_APPS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --config ${{ matrix.build_type }}

      - name: Run Demo Verification
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/tradenex.exe demo
          else
            ./build/tradenex demo
          fi
