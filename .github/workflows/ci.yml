name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.build_type }})${{ matrix.sanitize == 'ON' && ' + sanitizers' || '' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cxx: g++
            build_type: Release
            sanitize: OFF
          - os: ubuntu-24.04
            compiler: clang
            cxx: clang++
            build_type: Release
            sanitize: ON
          - os: windows-latest
            compiler: msvc
            cxx: ""
            build_type: Release
            sanitize: OFF

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            cmake -S . -B build \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DTRADENEX_SANITIZE=${{ matrix.sanitize }} \
              -DTRADENEX_BUILD_TESTS=ON \
              -DTRADENEX_BUILD_BENCHMARKS=ON \
              -DTRADENEX_BUILD_APPS=ON
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DTRADENEX_SANITIZE=${{ matrix.sanitize }} \
              -DTRADENEX_BUILD_TESTS=ON \
              -DTRADENEX_BUILD_BENCHMARKS=ON \
              -DTRADENEX_BUILD_APPS=ON
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Run Demo Verification
        run: |
          if [ -f "./build/tradenex" ]; then
            ./build/tradenex demo
          elif [ -f "./build/tradenex.exe" ]; then
            ./build/tradenex.exe demo
          elif [ -f "./build/Release/tradenex.exe" ]; then
            ./build/Release/tradenex.exe demo
          elif [ -f "./build/Debug/tradenex.exe" ]; then
            ./build/Debug/tradenex.exe demo
          else
            echo "Searching for tradenex binary..."
            find build/ -name "tradenex*"
            exit 1
          fi
